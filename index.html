<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Hustle Finder — @dharambuilds</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0B1A;--surface:#15122A;--surface2:#1E1A36;--border:#2A2550;--accent:#7C5CFC;--accent2:#B8A4FF;--gold:#F0A500;--green:#22C97A;--text:#EEE9FF;--muted:#8A82A8;--danger:#FF6B6B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(124,92,252,.18) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 80% 80%,rgba(240,165,0,.10) 0%,transparent 60%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:1.5rem 1.2rem 4rem;}
.header{text-align:center;padding:2rem 0 1.5rem;}
.badge{display:inline-block;background:linear-gradient(135deg,rgba(124,92,252,.25),rgba(240,165,0,.15));border:1px solid rgba(124,92,252,.4);color:var(--accent2);font-size:.68rem;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:.3rem .9rem;border-radius:100px;margin-bottom:1rem;}
.header h1{font-family:'Syne',sans-serif;font-size:clamp(1.7rem,5vw,2.6rem);font-weight:800;line-height:1.1;background:linear-gradient(135deg,#fff 30%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header p{margin-top:.7rem;color:var(--muted);font-size:.9rem;line-height:1.6;max-width:480px;margin-inline:auto;}
.by{margin-top:.8rem;font-size:.78rem;color:var(--accent);font-weight:500;}
.progress-bar{height:3px;background:var(--border);border-radius:3px;margin:1.2rem 0 1.5rem;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width .5s ease;}
.steps{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.2rem;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s;}
.step-dot.active{background:var(--accent);transform:scale(1.4);}
.step-dot.done{background:var(--green);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1rem;animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-size:.65rem;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem;}
.card h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.1rem;color:#fff;}
.options{display:grid;gap:.6rem;}
.options.cols2{grid-template-columns:1fr 1fr;}
.opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;padding:.75rem .9rem;cursor:pointer;transition:all .2s;font-size:.86rem;color:var(--text);text-align:left;display:flex;align-items:center;gap:.55rem;}
.opt:hover{border-color:var(--accent);background:rgba(124,92,252,.12);}
.opt.selected{border-color:var(--accent);background:rgba(124,92,252,.18);color:#fff;}
.opt-icon{font-size:1.2rem;}
.opt-text{flex:1;}
.opt-text strong{display:block;font-weight:500;font-size:.85rem;}
.check{width:17px;height:17px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.opt.selected .check{background:var(--accent);border-color:var(--accent);}
.opt.selected .check::after{content:'✓';color:#fff;font-size:.6rem;font-weight:700;}
.btn-row{display:flex;gap:.7rem;margin-top:1.2rem;}
.btn{flex:1;padding:.8rem 1.3rem;border-radius:11px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,var(--accent),#9B7BFF);color:#fff;box-shadow:0 4px 18px rgba(124,92,252,.35);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(124,92,252,.5);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);flex:0;padding:.8rem 1.1rem;}
.btn-ghost:hover{border-color:var(--muted);color:var(--text);}
.ai-card{background:linear-gradient(135deg,var(--surface),#1C1835);border:1px solid rgba(124,92,252,.35);border-radius:18px;padding:1.6rem;animation:fadeUp .5s ease both;position:relative;overflow:hidden;}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--green));}
.ai-header{display:flex;align-items:center;gap:.7rem;margin-bottom:1.3rem;}
.ai-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#9B7BFF);display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;}
.ai-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;}
.ai-sub{font-size:.72rem;color:var(--muted);}
.ai-content{line-height:1.8;font-size:.88rem;color:#DDD8F5;}
.ai-content strong{color:var(--accent2);}
.loading{display:flex;align-items:center;gap:.7rem;color:var(--muted);font-size:.88rem;padding:.8rem 0;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 2px;animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chat-wrap{margin-top:1rem;}
.chat-messages{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;margin-bottom:.9rem;}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.msg{padding:.75rem .9rem;border-radius:13px;font-size:.84rem;line-height:1.65;max-width:92%;animation:fadeUp .3s ease;}
.msg.user{background:rgba(124,92,252,.2);border:1px solid rgba(124,92,252,.3);align-self:flex-end;color:#fff;}
.msg.ai{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;color:#DDD8F5;}
.msg.ai strong{color:var(--accent2);}
.chat-input-row{display:flex;gap:.55rem;}
.chat-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;padding:.7rem .9rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;}
.chat-input:focus{border-color:var(--accent);}
.chat-input::placeholder{color:var(--muted);}
.chat-send{background:var(--accent);border:none;border-radius:11px;width:42px;height:42px;cursor:pointer;color:#fff;font-size:1rem;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send:hover{background:#9B7BFF;}
.chat-send:disabled{opacity:.4;cursor:not-allowed;}
.cta-card{background:linear-gradient(135deg,rgba(124,92,252,.2),rgba(240,165,0,.1));border:1px solid rgba(124,92,252,.4);border-radius:18px;padding:1.6rem;text-align:center;margin-top:1.2rem;}
.cta-card h3{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:.4rem;}
.cta-card p{color:var(--muted);font-size:.84rem;line-height:1.6;margin-bottom:1rem;}
.cta-btn{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;padding:.8rem 1.8rem;border-radius:100px;text-decoration:none;transition:all .2s;}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,92,252,.4);}
.reset-row{text-align:center;margin-top:.9rem;}
.reset-btn{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;text-decoration:underline;}
.error-box{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:11px;padding:1rem;color:var(--danger);font-size:.85rem;margin-bottom:.8rem;}
@media(max-width:480px){.options.cols2{grid-template-columns:1fr;}.card{padding:1.2rem;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">🚀 Easy Launch Framework — Free Tool</div>
    <h1>Find Your Perfect<br>Side Hustle in 2 Minutes</h1>
    <p>Answer 4 quick questions and get a personalised AI-powered side hustle plan built from your existing skills.</p>
    <div class="by">by @dharambuilds · Instagram</div>
  </div>
  <div class="steps" id="stepDots"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="mainContent"></div>
</div>
<script>
const API_URL='/api/chat';
const questions=[
  {id:'background',label:'Step 1 of 4 — Your Background',question:'What field or industry have you been working in?',cols:2,options:[
    {icon:'💻',label:'Tech / IT / Software',value:'Tech/IT/Software engineering'},
    {icon:'🏠',label:'Real Estate',value:'Real estate / property sales'},
    {icon:'📊',label:'Finance / Banking',value:'Finance / banking / accounting'},
    {icon:'🎨',label:'Design / Creative',value:'Design / creative / content'},
    {icon:'📣',label:'Sales / Marketing',value:'Sales / marketing / BPO'},
    {icon:'🏥',label:'Healthcare',value:'Healthcare / medical'},
    {icon:'📚',label:'Education / Training',value:'Education / training / HR'},
    {icon:'⚙️',label:'Operations / Admin',value:'Operations / admin / management'},
  ]},
  {id:'experience',label:'Step 2 of 4 — Your Experience',question:'How many years of work experience do you have?',cols:2,options:[
    {icon:'🌱',label:'Just starting out',value:'0–2 years (fresher/beginner)'},
    {icon:'📈',label:'2–5 years',value:'2–5 years of experience'},
    {icon:'💼',label:'5–10 years',value:'5–10 years of solid experience'},
    {icon:'🏆',label:'10+ years',value:'10+ years of deep expertise'},
  ]},
  {id:'goal',label:'Step 3 of 4 — Your Goal',question:'What do you most want from your side hustle?',cols:2,options:[
    {icon:'💰',label:'Extra income fast',value:'Earn extra income as quickly as possible'},
    {icon:'🔥',label:'Quit my job eventually',value:'Build something big enough to quit my job'},
    {icon:'🕊️',label:'Work from anywhere',value:'Location and time freedom'},
    {icon:'🎯',label:'Build my brand',value:'Build a personal brand and audience online'},
  ]},
  {id:'constraint',label:'Step 4 of 4 — Your Situation',question:'What feels like your biggest challenge right now?',cols:2,options:[
    {icon:'❓',label:"Don't know what to sell",value:"Don't know what skill or niche to pick"},
    {icon:'⏰',label:'Very limited time',value:'Very limited time while working full time'},
    {icon:'📱',label:'No audience yet',value:'No audience or followers yet'},
    {icon:'😰',label:'Fear of starting',value:'Afraid of failing or what people will think'},
  ]},
];

let answers={},currentStep=0,chatHistory=[],aiResult=null;

function renderDots(){
  document.getElementById('stepDots').innerHTML=questions.map((_,i)=>`<div class="step-dot ${i<currentStep?'done':i===currentStep?'active':''}"></div>`).join('');
  document.getElementById('progressFill').style.width=(currentStep>=questions.length?100:Math.round(currentStep/questions.length*100))+'%';
}

function renderStep(idx){
  currentStep=idx;renderDots();
  const q=questions[idx];
  document.getElementById('mainContent').innerHTML=`
    <div class="card">
      <div class="card-label">${q.label}</div>
      <h2>${q.question}</h2>
      <div class="options ${q.cols===2?'cols2':''}">
        ${q.options.map(o=>`<div class="opt ${answers[q.id]===o.value?'selected':''}" onclick="selectOpt('${q.id}','${o.value.replace(/'/g,"\\'")}',this)">
          <span class="opt-icon">${o.icon}</span>
          <span class="opt-text"><strong>${o.label}</strong></span>
          <span class="check"></span>
        </div>`).join('')}
      </div>
      <div class="btn-row">
        ${idx>0?`<button class="btn btn-ghost" onclick="renderStep(${idx-1})">←</button>`:''}
        <button class="btn btn-primary" id="nextBtn" onclick="nextStep(${idx})" ${answers[q.id]?'':'disabled'}>
          ${idx===questions.length-1?'✨ Find My Side Hustle →':'Next →'}
        </button>
      </div>
    </div>`;
}

function selectOpt(id,val,el){
  answers[id]=val;
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  const b=document.getElementById('nextBtn');
  if(b)b.removeAttribute('disabled');
}

function nextStep(idx){
  if(!answers[questions[idx].id])return;
  if(idx===questions.length-1){currentStep=questions.length;renderDots();callAI();}
  else renderStep(idx+1);
}

function showLoading(container){
  container.innerHTML=`<div class="loading"><div class="spinner"></div><span>Building your personalised plan...</span></div>
  <div style="margin-top:.8rem;color:var(--muted);font-size:.78rem;">Scanning 607+ niches → Matching your background → Crafting your roadmap...</div>`;
}

function fmt(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n-\s/g,'<br>• ').replace(/\n/g,'<br>');
}

async function callAI(){
  document.getElementById('mainContent').innerHTML=`<div class="card"><div id="loadArea"></div></div>`;
  showLoading(document.getElementById('loadArea'));

  const prompt=`You are a side hustle coach from the Easy Launch Framework by @dharambuilds on Instagram, helping frustrated 9-to-5 Indian professionals earn online using their existing skills.

User profile:
- Industry: ${answers.background}
- Experience: ${answers.experience}  
- Goal: ${answers.goal}
- Biggest challenge: ${answers.constraint}

Give a PERSONALISED side hustle plan structured exactly like this:

**🎯 Your Top 2 Side Hustle Ideas**
[2 specific niche ideas perfectly matching their background. Be very specific.]

**💡 Why This Works For You**
[2-3 sentences on why their background makes them uniquely qualified. Personal and validating.]

**🚀 Your 3-Step Action Plan This Week**
[3 specific doable actions for THIS week. Each under 1 hour.]

**💰 Realistic Income Potential (Indian Rupees)**
[Month 1, Month 3, Month 6 honest ranges in ₹]

**⚡ Do This in the Next 30 Minutes**
[One ultra-specific action to start right now.]

Tone: warm, direct, energising. Simple punchy sentences. Max 300 words.`;

  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok)throw new Error('Server error '+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||'API error');
    aiResult=data.content?.[0]?.text;
    if(!aiResult)throw new Error('Empty response');
    chatHistory=[{role:'user',content:prompt},{role:'assistant',content:aiResult}];
    renderResult();
  }catch(e){
    document.getElementById('mainContent').innerHTML=`
      <div class="card">
        <div class="error-box">⚠️ ${e.message}. Please try again.</div>
        <div class="btn-row"><button class="btn btn-primary" onclick="callAI()">Try Again</button></div>
      </div>`;
  }
}

function renderResult(){
  document.getElementById('mainContent').innerHTML=`
    <div class="ai-card">
      <div class="ai-header">
        <div class="ai-avatar">🤖</div>
        <div><div class="ai-name">Your Personalised Plan</div><div class="ai-sub">Easy Launch Framework · @dharambuilds</div></div>
      </div>
      <div class="ai-content">${fmt(aiResult)}</div>
    </div>
    <div class="card chat-wrap">
      <div class="card-label">💬 Ask a Follow-up</div>
      <h2>Got questions? Ask me anything.</h2>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chatInput" placeholder="e.g. How do I get my first client?" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat();}"/>
        <button class="chat-send" id="chatSend" onclick="sendChat()">➤</button>
      </div>
    </div>
    <div class="cta-card">
      <h3>🔥 Ready for Your First 10 Paid Customers in 60 Days?</h3>
      <p>Join the <strong>Easy Launch Framework</strong> — 1-on-1 coaching with @dharambuilds. Founding batch open now.</p>
      <a class="cta-btn" href="https://instagram.com/dharambuilds" target="_blank">DM LAUNCH on Instagram →</a>
    </div>
    <div class="reset-row"><button class="reset-btn" onclick="resetTool()">↺ Start over</button></div>`;
}

async function sendChat(){
  const inp=document.getElementById('chatInput');
  const btn=document.getElementById('chatSend');
  const msg=inp.value.trim();
  if(!msg||btn.disabled)return;
  inp.value='';btn.disabled=true;
  const box=document.getElementById('chatMessages');
  box.innerHTML+=`<div class="msg user">${msg}</div>`;
  const tid='t'+Date.now();
  box.innerHTML+=`<div class="msg ai" id="${tid}"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  box.scrollTop=box.scrollHeight;
  chatHistory.push({role:'user',content:msg});
  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:`Side hustle coach from Easy Launch Framework by @dharambuilds. User: Industry=${answers.background}, Experience=${answers.experience}, Goal=${answers.goal}, Challenge=${answers.constraint}. Be specific, warm, max 150 words.`,
        messages:chatHistory
      })
    });
    if(!res.ok)throw new Error('Error '+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.content?.[0]?.text||'Sorry, try again.';
    chatHistory.push({role:'assistant',content:reply});
    document.getElementById(tid).innerHTML=fmt(reply);
  }catch(e){
    document.getElementById(tid).innerHTML=`<span style="color:var(--danger)">Error — please try again.</span>`;
  }
  box.scrollTop=box.scrollHeight;
  btn.disabled=false;
}

function resetTool(){answers={};chatHistory=[];aiResult=null;renderStep(0);}
renderStep(0);
</script>
</body>
</html>
